name: "LumaTrack: Report Run"
description: >-
  Report a workflow run (success or failure) to LumaTrack, the system of
  record for automation value.
author: LumaTrack
branding:
  icon: activity
  color: green

inputs:
  base-url:
    description: >-
      Your LumaTrack host. Defaults to https://lumatrack.io; set it only if you
      run LumaTrack on your own domain.
    required: false
    default: "https://lumatrack.io"
  api-key:
    description: "LumaTrack API key (store it in secrets)"
    required: true
  automation:
    description: "Automation slug in LumaTrack that this workflow reports as"
    required: true
  status:
    description: >-
      success, failure, cancelled, or skipped. Pass the job status
      expression (job.status) to report honestly; each maps to a status of
      its own, and neither skipped nor cancelled counts as a failure.
      Reasons are preserved.
    required: false
    default: success
  duration-seconds:
    description: "Wall-clock runtime in seconds (omit to skip)"
    required: false
    default: ""
  units:
    description: >-
      Records/items this run processed; drives per-unit valuation when the
      automation is valued per unit (omit to use the server default of 1)
    required: false
    default: ""
  external-id:
    description: >-
      Idempotency key; defaults to the workflow run id plus attempt, so
      each attempt is one run and retries of this step are safe
    required: false
    default: ""
  failure-reason:
    description: "Root cause for failures, e.g. tests/unit or deploy/timeout"
    required: false
    default: ""
  metadata:
    description: 'JSON object kept with the run, e.g. {"ref": "refs/heads/main"}'
    required: false
    default: ""
  fail-on-error:
    description: >-
      Fail the job when reporting fails. Default false: a LumaTrack outage
      should not break your pipeline.
    required: false
    default: "false"

outputs:
  run-id:
    description: "The LumaTrack run id (run_...)"
    value: ${{ steps.report.outputs.run-id }}
  deduplicated:
    description: "true when this external id had already been reported"
    value: ${{ steps.report.outputs.deduplicated }}

runs:
  using: composite
  steps:
    - id: report
      shell: bash
      env:
        LT_BASE_URL: ${{ inputs.base-url }}
        LT_API_KEY: ${{ inputs.api-key }}
        LT_AUTOMATION: ${{ inputs.automation }}
        LT_STATUS: ${{ inputs.status }}
        LT_DURATION_SECONDS: ${{ inputs.duration-seconds }}
        LT_UNITS: ${{ inputs.units }}
        LT_EXTERNAL_ID: ${{ inputs.external-id }}
        LT_FAILURE_REASON: ${{ inputs.failure-reason }}
        LT_METADATA: ${{ inputs.metadata }}
        LT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: bash "${{ github.action_path }}/report-run.sh"
